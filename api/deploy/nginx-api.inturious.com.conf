# certbot --nginx -d api.inturious.com rewrites this to add the TLS block.
server {
    listen 80;
    listen [::]:80;
    server_name api.inturious.com;

    access_log /var/log/nginx/inturious-api.access.log;
    error_log  /var/log/nginx/inturious-api.error.log;

    # Telemetry and stats only; nothing here needs a large body.
    client_max_body_size 16k;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 30s;
    }
}
